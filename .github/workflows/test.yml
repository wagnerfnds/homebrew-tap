name: Formula
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Tap local checkout
        run: |
          brew tap wagnerfnds/tap "$GITHUB_WORKSPACE"
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula wagnerfnds/tap/lazybrew
          fi
      - run: brew style wagnerfnds/tap/lazybrew
      - run: brew audit --strict wagnerfnds/tap/lazybrew
      - run: brew install wagnerfnds/tap/lazybrew
      - run: brew test wagnerfnds/tap/lazybrew
